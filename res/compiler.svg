<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Degradados -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>

    <linearGradient id="gearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.3"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fondo: Cuadrado redondeado (Squircle) -->
  <rect x="12" y="12" width="232" height="232" rx="48" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4"/>

  <!-- Engranaje Central del Compilador (Motor de Traducción) -->
  <g transform="translate(128,128)" opacity="0.35">
    <!-- Dientes del engranaje -->
    <path d="
      M -18 -80 L 18 -80 L 22 -62 A 65 65 0 0 1 50 -48 L 70 -58 L 88 -30 L 72 -14 A 65 65 0 0 1 76 16 L 94 32 L 80 62 L 56 54 A 65 65 0 0 1 30 72 L 20 90 L -20 90 L -30 72 A 65 65 0 0 1 -56 54 L -80 62 L -94 32 L -76 16 A 65 65 0 0 1 -72 -14 L -88 -30 L -70 -58 L -50 -48 A 65 65 0 0 1 -22 -62 Z"
      fill="url(#gearGrad)" stroke="#38BDF8" stroke-width="2"/>
    <!-- Hueco central del engranaje -->
    <circle cx="0" cy="0" r="42" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
  </g>

  <!-- Pistas de Circuito / Binario (Compilación) -->
  <g stroke="#38BDF8" stroke-width="2" stroke-linecap="round" opacity="0.4">
    <line x1="40" y1="60" x2="70" y2="60"/>
    <circle cx="70" cy="60" r="3" fill="#38BDF8"/>
    <line x1="216" y1="196" x2="186" y2="196"/>
    <circle cx="186" cy="196" r="3" fill="#38BDF8"/>
    <line x1="196" y1="60" x2="176" y2="60"/>
    <circle cx="176" cy="60" r="3" fill="#38BDF8"/>
    <line x1="60" y1="196" x2="80" y2="196"/>
    <circle cx="80" cy="196" r="3" fill="#38BDF8"/>
  </g>

  <!-- Icono de Código: Brackets y Barra de Compilación < / > -->
  <!-- Bracket Izquierdo < (Verde Esmeralda - Código Fuente) -->
  <path d="M 88 94 L 46 128 L 88 162"
        fill="none" stroke="#10B981" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Barra Central / (Cian - Transformación Léxica) -->
  <line x1="144" y1="84" x2="112" y2="172"
        stroke="#38BDF8" stroke-width="13" stroke-linecap="round"
        filter="url(#glow)"/>

  <!-- Bracket Derecho > (Ámbar / Dorado - Tokens y Salida) -->
  <path d="M 168 94 L 210 128 L 168 162"
        fill="none" stroke="#F59E0B" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Etiqueta distintiva LP (Lenguaje de Programación) -->
  <rect x="96" y="196" width="64" height="24" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="128" y="213" fill="#38BDF8" font-family="'Consolas', 'Segoe UI', monospace" font-size="13" font-weight="bold" text-anchor="middle" letter-spacing="2">LP</text>
</svg>
